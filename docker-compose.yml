# =============================================================================
# 并行计算与AI应用 · 面向UGC社区的智能内容审核与发布系统
# 一键启动：docker compose up -d --build
# =============================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: community_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1106}
      MYSQL_DATABASE: ${DB_NAME:-community}
      TZ: Asia/Shanghai
    ports:
      # 后端通过 Docker 内网 mysql:3306 访问数据库，此映射仅供宿主机上的数据库工具连接。
      # 宿主机 3306 常被本地 MySQL 占用，故默认映射到 3307；需要改端口时设置环境变量 MYSQL_HOST_PORT。
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-1106}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: community_redis
    restart: always
    ports:
      - "6379:6379"
    # 说明：缓存与热榜 ZSet 都在这里，密码需与后端 .env 中的 REDIS_PASSWORD 一致
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-1106}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-1106}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Python 侧：并行审核与并行总结（零第三方依赖）
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: community_ai
    restart: always
    ports:
      - "8000:8000"
    # 优先从 ai-service/.env 读取配置（大模型密钥就放在这里）
    env_file:
      - ./ai-service/.env
    environment:
      # 下面的值仅作为 ai-service/.env 缺失时的兜底默认；
      # 注意 compose 的 ${VAR} 变量替换读取的是根目录 .env 与宿主机环境，
      # 因此大模型密钥应写在 ai-service/.env 中，或导出为宿主机环境变量。
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      # 并行参数：单请求并发度 / 审核工作进程数 / 在途请求上限
      AI_CONCURRENCY: ${AI_CONCURRENCY:-6}
      AI_WORKERS: ${AI_WORKERS:-4}
      AI_MAX_INFLIGHT: ${AI_MAX_INFLIGHT:-16}
      AI_CHUNK_SIZE: ${AI_CHUNK_SIZE:-600}
      AI_CHUNK_THRESHOLD: ${AI_CHUNK_THRESHOLD:-800}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Go 侧：业务与并行审核编排
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: community_app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      AI_SERVICE_URL: http://ai-service:8000

volumes:
  mysql_data:
  redis_data:
